<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500&family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#E7E0D6}
  body{font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased}
  ::selection{background:#E4A02C;color:#241A14}
  .serif{font-family:'Noto Serif KR','Playfair Display',serif}
  .fig{font-family:'Playfair Display',serif;font-feature-settings:"lnum" 1}
  .rail::-webkit-scrollbar{height:12px}
  .rail::-webkit-scrollbar-thumb{background:#C9BCA8;border-radius:8px;border:3px solid #E7E0D6}
  .rail::-webkit-scrollbar-track{background:transparent}
</style>
</helmet>

<div style="min-height:100vh;background:{{ studioBg }};padding:44px 0 60px;font-family:'Pretendard',sans-serif">

  <div style="max-width:1180px;margin:0 auto 8px;padding:0 52px">
    <div style="font-size:13px;font-weight:700;letter-spacing:.16em;color:#9C8B78;text-transform:uppercase;margin-bottom:14px">인스타그램 카드뉴스 · 7장 · 1080 × 1350</div>
    <h1 class="serif" style="font-size:40px;font-weight:700;letter-spacing:-.01em;color:#2A211B;line-height:1.2;margin-bottom:12px">비타민C를 지키는 마이크로 캡슐</h1>
    <p style="font-size:15.5px;line-height:1.6;color:#7C6C5B;max-width:760px">Membrane emulsification-derived cellulose microbeads encapsulating vitamin C with pH-sensitive release via chitosan nanowhisker coating · <span style="color:#A6937E">Carbohydrate Polymers 372 (2026)</span></p>
  </div>

  <div class="rail" style="{{ railStyle }}">

    <!-- ============ CARD 1 · COVER ============ -->
    <figure style="margin:0;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:15px">
      <div style="width:497px;height:621px;flex:none;border-radius:24px;overflow:hidden;box-shadow:0 34px 74px rgba(60,38,16,.24);position:relative">
        <div style="position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(.46);transform-origin:top left;background:radial-gradient(120% 90% at 78% 8%,#3A2818 0%,#241A14 46%,#1A120C 100%);padding:78px;display:flex;flex-direction:column;color:#F6ECDD">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-size:22px;font-weight:700;letter-spacing:.16em;color:#E4A02C">CARBOHYDRATE POLYMERS · 2026</div>
            <div class="fig" style="font-size:23px;color:#8A7256">01 / 07</div>
          </div>

          <div style="position:absolute;top:250px;right:70px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FDE0A0 0%,#F4B942 26%,#E4A02C 50%,#B26E1F 74%,#7A4A17 100%);box-shadow:0 0 130px 30px rgba(228,160,44,.42),inset -26px -30px 60px rgba(90,52,14,.55),inset 18px 20px 44px rgba(255,236,196,.5)"></div>
          <div style="position:absolute;top:288px;right:230px;width:70px;height:52px;border-radius:50%;background:rgba(255,240,208,.66);filter:blur(9px)"></div>
          <div style="position:absolute;top:236px;right:96px;width:16px;height:16px;border-radius:50%;background:#F4B942;box-shadow:0 0 24px 6px rgba(244,185,66,.7)"></div>
          <div style="position:absolute;top:600px;right:150px;width:11px;height:11px;border-radius:50%;background:#E4A02C;box-shadow:0 0 18px 5px rgba(228,160,44,.6)"></div>

          <div style="margin-top:auto">
            <div style="font-size:27px;font-weight:600;color:#C9A063;letter-spacing:.02em;margin-bottom:26px">바르는 비타민C의 오래된 숙제</div>
            <h2 class="serif" style="font-size:104px;font-weight:700;line-height:1.1;letter-spacing:-.02em;color:#FBF3E4">비타민C를<br>캡슐에 가두다</h2>
            <p style="font-size:31px;line-height:1.6;color:#C4B29C;margin-top:34px;max-width:820px;text-wrap:pretty">공기에 닿으면 노랗게 사라지던 비타민C. 작은 셀룰로오스 구슬에 담고 키토산으로 감쌌더니, 더 오래·더 부드럽게 스며든다.</p>
          </div>

          <div style="margin-top:52px;padding-top:30px;border-top:1px solid rgba(246,236,221,.18);display:flex;align-items:center;gap:16px">
            <div style="width:46px;height:46px;border-radius:13px;background:rgba(228,160,44,.16);border:1px solid rgba(228,160,44,.4);display:flex;align-items:center;justify-content:center;color:#E4A02C;font-weight:800;font-size:22px">C</div>
            <div style="font-size:23px;line-height:1.4;color:#A08A6E">KITECH · 한양대학교 · 중앙대학교<br><span style="color:#7E6A50">피부를 위한 전달 기술 연구</span></div>
          </div>
        </div>
      </div>
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><figcaption style="font-size:13.5px;font-weight:600;color:#8C7B68;letter-spacing:.04em">01 · 표지</figcaption></sc-if>
    </figure>

    <!-- ============ CARD 2 · PROBLEM ============ -->
    <figure style="margin:0;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:15px">
      <div style="width:497px;height:621px;flex:none;border-radius:24px;overflow:hidden;box-shadow:0 34px 74px rgba(60,38,16,.18);position:relative">
        <div style="position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(.46);transform-origin:top left;background:#FBF5EC;padding:78px;display:flex;flex-direction:column;color:#2A211B">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:64px">
            <div style="font-size:22px;font-weight:700;letter-spacing:.16em;color:#B26E1F">왜 어려울까</div>
            <div class="fig" style="font-size:23px;color:#B7A48F">02 / 07</div>
          </div>

          <h2 class="serif" style="font-size:76px;font-weight:700;line-height:1.16;letter-spacing:-.02em;margin-bottom:20px">좋은 성분인 건<br>알지만</h2>
          <p style="font-size:30px;line-height:1.6;color:#8A7A6B;max-width:820px;margin-bottom:56px;text-wrap:pretty">비타민C는 피부에 좋기로 유명하다. 그런데 실제로 '잘 바르기'는 놀랄 만큼 까다롭다. 이유는 세 가지.</p>

          <div style="display:flex;flex-direction:column;gap:26px">
            <div style="display:flex;gap:28px;align-items:flex-start;background:#F5ECDD;border-radius:22px;padding:34px 36px">
              <div class="fig" style="font-size:44px;font-weight:700;color:#E4A02C;line-height:1;flex:none;width:56px">01</div>
              <div><div style="font-size:34px;font-weight:800;margin-bottom:8px">쉽게 산화된다</div><div style="font-size:27px;line-height:1.55;color:#8A7A6B">공기·빛·열에 닿으면 금방 산화돼 누렇게 변하고, 효과도 함께 사라진다.</div></div>
            </div>
            <div style="display:flex;gap:28px;align-items:flex-start;background:#F5ECDD;border-radius:22px;padding:34px 36px">
              <div class="fig" style="font-size:44px;font-weight:700;color:#E4A02C;line-height:1;flex:none;width:56px">02</div>
              <div><div style="font-size:34px;font-weight:800;margin-bottom:8px">잘 스며들지 않는다</div><div style="font-size:27px;line-height:1.55;color:#8A7A6B">물을 좋아하는 성질이라, 기름진 피부 장벽을 잘 통과하지 못한다.</div></div>
            </div>
            <div style="display:flex;gap:28px;align-items:flex-start;background:#F5ECDD;border-radius:22px;padding:34px 36px">
              <div class="fig" style="font-size:44px;font-weight:700;color:#E4A02C;line-height:1;flex:none;width:56px">03</div>
              <div><div style="font-size:34px;font-weight:800;margin-bottom:8px">농도를 높이면 자극</div><div style="font-size:27px;line-height:1.55;color:#8A7A6B">그래서 양을 늘리면 붉어짐·따가움 같은 자극이 생기기 쉽다.</div></div>
            </div>
          </div>

          <div style="margin-top:auto;padding-top:44px;display:flex;align-items:center;gap:20px">
            <div style="font-size:23px;font-weight:700;color:#9C8B78;letter-spacing:.02em;white-space:nowrap">신선 → 산화</div>
            <div style="flex:1;height:26px;border-radius:99px;background:linear-gradient(90deg,#F4B942 0%,#E4A02C 34%,#C98A2E 60%,#9E7038 80%,#6E5430 100%)"></div>
          </div>
        </div>
      </div>
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><figcaption style="font-size:13.5px;font-weight:600;color:#8C7B68;letter-spacing:.04em">02 · 문제</figcaption></sc-if>
    </figure>

    <!-- ============ CARD 3 · MICROBEAD ============ -->
    <figure style="margin:0;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:15px">
      <div style="width:497px;height:621px;flex:none;border-radius:24px;overflow:hidden;box-shadow:0 34px 74px rgba(60,38,16,.18);position:relative">
        <div style="position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(.46);transform-origin:top left;background:#FBF5EC;padding:78px;display:flex;flex-direction:column;color:#2A211B">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:52px">
            <div style="font-size:22px;font-weight:700;letter-spacing:.16em;color:#B26E1F">해결의 실마리 ①</div>
            <div class="fig" style="font-size:23px;color:#B7A48F">03 / 07</div>
          </div>

          <h2 class="serif" style="font-size:76px;font-weight:700;line-height:1.16;letter-spacing:-.02em;margin-bottom:26px">스펀지 같은<br>구슬에 담는다</h2>

          <div style="display:flex;gap:48px;align-items:center;margin-bottom:20px">
            <p style="font-size:29px;line-height:1.62;color:#6E5F51;flex:1;text-wrap:pretty">식물에서 온 천연 섬유 <b style="color:#2A211B">셀룰로오스</b>로 만든 아주 작은 구슬. 미세한 막에 통과시켜 크기를 고르게 맞추고, 표면을 살짝 녹여 촘촘한 구멍을 냈다. 그 구멍마다 비타민C가 스며든다.</p>
            <svg width="330" height="330" viewBox="0 0 200 200" style="flex:none">
              <defs><radialGradient id="bead3" cx="38%" cy="34%"><stop offset="0%" stop-color="#FCE7B4"/><stop offset="42%" stop-color="#F1C877"/><stop offset="78%" stop-color="#E0A244"/><stop offset="100%" stop-color="#C6842B"/></radialGradient></defs>
              <circle cx="100" cy="100" r="92" fill="url(#bead3)" stroke="#B26E1F" stroke-width="2"/>
              <g fill="#B87A28" opacity="0.5">
                <circle cx="72" cy="66" r="9"/><circle cx="118" cy="58" r="7"/><circle cx="140" cy="92" r="10"/><circle cx="86" cy="104" r="11"/><circle cx="118" cy="120" r="8"/><circle cx="62" cy="128" r="8"/><circle cx="146" cy="132" r="7"/><circle cx="100" cy="150" r="9"/><circle cx="52" cy="96" r="6"/><circle cx="126" cy="88" r="5"/>
              </g>
              <g fill="#FBF0D6" opacity="0.9"><circle cx="80" cy="82" r="3"/><circle cx="108" cy="98" r="3"/><circle cx="92" cy="128" r="3"/><circle cx="130" cy="110" r="2.6"/><circle cx="70" cy="112" r="2.4"/></g>
            </svg>
          </div>

          <div style="margin-top:auto;display:flex;gap:24px">
            <div style="flex:1;background:#241A14;border-radius:22px;padding:38px 36px;color:#F6ECDD">
              <div class="fig" style="font-size:66px;font-weight:700;color:#F4B942;line-height:1">&lt; 2.39<span style="font-size:32px;color:#C9A063"> μm</span></div>
              <div style="font-size:26px;font-weight:700;margin-top:10px">평균 지름</div>
              <div style="font-size:23px;color:#A08A6E;margin-top:6px">머리카락 굵기의 약 1/30</div>
            </div>
            <div style="flex:1;background:#241A14;border-radius:22px;padding:38px 36px;color:#F6ECDD">
              <div class="fig" style="font-size:66px;font-weight:700;color:#F4B942;line-height:1">193.6<span style="font-size:32px;color:#C9A063"> mg/g</span></div>
              <div style="font-size:26px;font-weight:700;margin-top:10px">담는 양 (최대)</div>
              <div style="font-size:23px;color:#A08A6E;margin-top:6px">구슬 1g에 비타민C 약 194mg</div>
            </div>
          </div>
        </div>
      </div>
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><figcaption style="font-size:13.5px;font-weight:600;color:#8C7B68;letter-spacing:.04em">03 · 구슬</figcaption></sc-if>
    </figure>

    <!-- ============ CARD 4 · COATING ============ -->
    <figure style="margin:0;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:15px">
      <div style="width:497px;height:621px;flex:none;border-radius:24px;overflow:hidden;box-shadow:0 34px 74px rgba(60,38,16,.24);position:relative">
        <div style="position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(.46);transform-origin:top left;background:radial-gradient(120% 100% at 20% 12%,#3A2818 0%,#241A14 52%,#1A120C 100%);padding:78px;display:flex;flex-direction:column;color:#F6ECDD">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:56px">
            <div style="font-size:22px;font-weight:700;letter-spacing:.16em;color:#E4A02C">해결의 실마리 ②</div>
            <div class="fig" style="font-size:23px;color:#8A7256">04 / 07</div>
          </div>

          <h2 class="serif" style="font-size:76px;font-weight:700;line-height:1.16;letter-spacing:-.02em;margin-bottom:34px;color:#FBF3E4">게 껍질에서 온<br>얇은 보호막</h2>

          <div style="display:flex;justify-content:center;margin:14px 0 40px">
            <div style="position:relative;width:400px;height:400px;display:flex;align-items:center;justify-content:center">
              <div style="position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(246,236,221,.82) 0deg .5deg,transparent .5deg 3.1deg);-webkit-mask:radial-gradient(circle,transparent 150px,#000 152px,#000 196px,transparent 198px);mask:radial-gradient(circle,transparent 150px,#000 152px,#000 196px,transparent 198px)"></div>
              <div style="width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FCE7B4 0%,#F1C877 42%,#E0A244 78%,#C6842B 100%);box-shadow:0 0 80px 10px rgba(228,160,44,.34),inset -18px -22px 44px rgba(90,52,14,.5)"></div>
              <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 62% 70%,transparent 60%,rgba(36,26,20,.28))"></div>
            </div>
          </div>

          <p style="font-size:29px;line-height:1.62;color:#C4B29C;max-width:900px;text-wrap:pretty">새우·게 껍질에서 얻는 천연 물질 <b style="color:#F4B942">키토산</b>을, 머리카락보다 훨씬 가는 '나노 위스커' 섬유로 만들어 구슬 표면에 촘촘히 입혔다. 이 막이 산소를 막아 비타민C를 더 오래 살아있게 하고, 다음 장의 '똑똑한 방출'을 가능하게 하는 열쇠가 된다.</p>

          <div style="margin-top:auto;padding-top:40px;display:flex;gap:14px">
            <span style="font-size:24px;font-weight:700;color:#241A14;background:#E4A02C;border-radius:99px;padding:14px 26px">산소 차단</span>
            <span style="font-size:24px;font-weight:700;color:#F4B942;background:rgba(228,160,44,.14);border:1px solid rgba(228,160,44,.4);border-radius:99px;padding:14px 26px">천연 유래</span>
            <span style="font-size:24px;font-weight:700;color:#F4B942;background:rgba(228,160,44,.14);border:1px solid rgba(228,160,44,.4);border-radius:99px;padding:14px 26px">항균성</span>
          </div>
        </div>
      </div>
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><figcaption style="font-size:13.5px;font-weight:600;color:#8C7B68;letter-spacing:.04em">04 · 코팅</figcaption></sc-if>
    </figure>

    <!-- ============ CARD 5 · pH RELEASE (HERO) ============ -->
    <figure style="margin:0;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:15px">
      <div style="width:497px;height:621px;flex:none;border-radius:24px;overflow:hidden;box-shadow:0 34px 74px rgba(60,38,16,.18);position:relative">
        <div style="position:absolute;top:0;left:0;width:1080px;height:1350px;transform:scale(.46);transform-origin:top left;background:#FBF5EC;padding:78px;display:flex;flex-direction:column;color:#2A211B">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:44px">
            <div style="font-size:22px;font-weight:700;letter-spacing:.16em;color:#B26E1F">핵심 결과</div>
            <div class="fig" style="font-size:23px;color:#B7A48F">05 / 07</div>
          </div>

          <h2 class="serif" style="font-size:74px;font-weight:700;line-height:1.16;letter-spacing:-.02em;margin-bottom:44px">피부 상태를 읽고<br>스스로 조절한다</h2>

          <div style="display:flex;gap:26px;align-items:flex-end;margin-bottom:36px">
            <div style="flex:1;background:#241A14;border-radius:24px;padding:40px 38px;display:flex;flex-direction:column;align-items:center">
              <div style="font-size:26px;font-weight:700;color:#C9A063;margin-bottom:6px">건강한 피부</div>
              <div style="font-size:23px;color:#8A7256;margin-bottom:24px">pH 5.5 · 약산성</div>
              <div style="width:120px;height:300px;border-radius:16px;background:rgba(246,236,221,.08);display:flex;align-items:flex-end;overflow:hidden;margin-bottom:24px"><div style="width:100%;height:100%;background:linear-gradient(180deg,#F4B942,#E4A02C)"></div></div>
              <div class="fig" style="font-size:82px;font-weight:800;color:#F4B942;line-height:1">20.78<span style="font-size:34px">%</span></div>
              <div style="font-size:24px;color:#A08A6E;margin-top:8px">더 많이 방출</div>
            </div>
            <div style="flex:1;background:#F1E6D6;border-radius:24px;padding:40px 38px;display:flex;flex-direction:column;align-items:center">
              <div style="font-size:26px;font-weight:700;color:#9E6146;margin-bottom:6px">자극받은 피부</div>
              <div style="font-size:23px;color:#B0967E;margin-bottom:24px">pH 7.4 · 중성~염증</div>
              <div style="width:120px;height:300px;border-radius:16px;background:#E4D6C3;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:24px"><div style="width:100%;height:61.3%;background:linear-gradient(180deg,#C79070,#A66B4E)"></div></div>
              <div class="fig" style="font-size:82px;font-weight:800;color:#9E6146;line-height:1">12.73<span style="font-size:34px">%</span></div>
              <div style="font-size:24px;color:#A6866C;margin-top:8px">덜 방출</div>
            </div>
          </div>

          <div style="margin-top:auto;background:#F5ECDD;border-radius:20px;padding:34px 36px">
            <p style="font-size:27px;line-height:1.58;color:#6E5F51;text-wrap:pretty">건강한 약산성 피부에선 비타민C를 <b style="color:#B26E1F">더 많이</b>, pH가 높은(자극·염증) 상태에선 <b style="color:#9E6146">덜</b> 내보낸다. 자극을 줄이는 데 도움이 될 수 있다.</p>
          </div>
        </div>
      </div>
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><figcaption style="font-size:13.5px;font-weight:600;color:#8C7B68;letter-spacing:.04em">05 · 똑똑한 방출</figcaption></sc-if>
    </figure>

    <!-- ============ CARD 6 · ANTIBACTERIAL ============ -->
