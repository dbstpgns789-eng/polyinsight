# PolyInsight 단일 호스트 배포 (Oracle Always Free VM)
# web ↔ backend는 compose 네트워크에서 service명으로 통신(= 기존 localhost 결합 대체).
# 외부 노출은 cloudflared 터널이 web:3000 한 곳만.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - WEB_BASE_URL=http://web:3000          # S7 Playwright가 방문할 렌더 라우트
      - DATABASE_URL=sqlite:////data/polyinsight.db
      - STORAGE_DIR=/data/blobstore           # L1(C3): 파일저장(카드PNG·export·유저자산)을 영속 볼륨에. 안 걸면 재배포 시 증발
    volumes:
      - polyinsight-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }   # 로그 무한증식→디스크풀 방지

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        BACKEND_ORIGIN: http://backend:8000    # Next rewrite는 빌드 시점에 구워짐 → build arg
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  polyinsight-data:
